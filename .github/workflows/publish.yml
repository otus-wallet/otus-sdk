# Stages the SDK on npm when a version tag is pushed, through npm's trusted publishing: no npm token is stored
# anywhere, and npm records this commit and this workflow as the package's provenance. A staged version is not public:
# a maintainer approves it with their 2FA (npm stage approve), so this workflow alone can never publish. npmjs.com names
# this repo and this file as the package's trusted publisher, allowed to stage only.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0 # its npm (11.19) has npm stage
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: The tag is package.json's version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm stage publish --access public
